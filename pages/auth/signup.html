<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../css/pages/signup.css">
  <title>Sign Up</title>
</head>
<body>
  <main class="card">
    <aside class="hero" aria-hidden="true">
      <img src="../../Gemini_Generated_Image_mzmgvhmzmgvhmzmg.jfif" alt="Hero picture">
    </aside>

    <section class="panel">
        <h1>Create Account</h1>
        <p class="sub">Already have an account? <a href="login.html">Log in</a></p>
  
        <form action="../../index.html" method="post">
          <div class="field">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" placeholder="Username" autocomplete="username" required>
          </div>
  
          <div class="field">
            <label for="email">Email Address</label>
            <input id="email" name="email" type="email" placeholder="Email Address" autocomplete="email" required>
          </div>
  
          <div class="row">
            <div class="field">
              <label for="password">Password</label>
              <div class="password">
                <input id="password" name="password" type="password" placeholder="Password" autocomplete="new-password" required>
              </div>
            </div>
            <div class="field">
              <label for="confirm_password">Confirm Password</label>
              <div class="password">
                <input id="confirm_password" name="confirm_password" type="password" placeholder="Confirm Password" autocomplete="new-password" required>
              </div>
            </div>
          </div>

          <label class="terms" style="margin-top: 5px; margin-bottom: 10px;">
            <input type="checkbox" id="is_admin" name="is_admin" value="true">
            <span class="box" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>
            </span>
            <span>Register as Administrator</span>
          </label>
  
          <button type="submit" class="primary">Create Account</button>
  
          <label class="terms">
            <input type="checkbox" checked>
            <span class="box" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>
            </span>
            <span>I agree to the <a href="#">Terms &amp; Condition</a></span>
          </label>
        </form>
    </section>
  </main>
</body>
</html>
