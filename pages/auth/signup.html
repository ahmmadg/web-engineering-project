<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — CineReview</title>
  <link rel="stylesheet" href="../../css/reset.css">
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/pages/auth.css">
</head>
<body class="auth-wrapper">

  <!-- Top Escape Navigation (Never trapped) -->
  <nav class="auth-nav-escape" aria-label="Auth Navigation">
    <a href="../../index.html" class="auth-nav-brand">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="4" width="20" height="16" rx="2"/>
        <path d="M7 8v8"/>
        <path d="M17 8v8"/>
        <path d="M2 12h20"/>
      </svg>
      <span>CineReview</span>
    </a>
    <a href="../../index.html" class="auth-nav-back">
      &larr; Back to Home
    </a>
  </nav>

  <!-- Split Screen Authentication Card -->
  <main class="auth-container">
    <div class="auth-card">

      <!-- Form Section -->
      <section class="auth-panel" aria-labelledby="signup-heading">
        <div class="auth-header">
          <h1 id="signup-heading">Create Account</h1>
          <p>Already registered? <a href="login.html">Log in here</a></p>
        </div>

        <!-- In Phase 1 static demo, submits via GET to the catalog page -->
        <form class="auth-form" action="../user/movies-list.html" method="get">

          <!-- Username (Required by Assignment) -->
          <div class="auth-field">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Choose a username" autocomplete="username" minlength="3" maxlength="30" required>
          </div>

          <!-- Email (Required by Assignment) -->
          <div class="auth-field">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="name@example.com" autocomplete="email" required>
          </div>

          <!-- Password & Confirm Password (Required by Assignment) -->
          <div class="row">
            <div class="auth-field">
              <label for="password">Password</label>
              <input type="password" id="password" name="password" placeholder="Min. 6 chars" autocomplete="new-password" minlength="6" required>
            </div>
            <div class="auth-field">
              <label for="confirm_password">Confirm Password</label>
              <input type="password" id="confirm_password" name="confirm_password" placeholder="Repeat password" autocomplete="new-password" minlength="6" required>
            </div>
          </div>

          <!-- is_admin Flag (Required by Assignment) -->
          <div class="auth-admin-toggle">
            <label class="auth-checkbox-group">
              <input type="checkbox" id="is_admin" name="is_admin" value="true">
              <span class="toggle-label">Register as Administrator</span>
            </label>
          </div>

          <!-- Terms & Condition -->
          <label class="auth-checkbox-group">
            <input type="checkbox" name="terms" required checked>
            <span>I agree to the <a href="#" style="color: inherit; text-decoration: underline;">Terms &amp; Conditions</a></span>
          </label>

          <!-- Submit Button -->
          <button type="submit" class="auth-btn-primary">Create Account</button>
        </form>
      </section>

      <!-- Clean Cinema Artwork -->
      <aside class="auth-hero" aria-hidden="true">
        <img class="auth-hero-img" src="../../Gemini_Generated_Image_mzmgvhmzmgvhmzmg.jfif" alt="Cinema theater backdrop">
        <div class="auth-hero-overlay"></div>
        <div class="auth-hero-caption">
          <h3>CineReview</h3>
          <p>Community ratings &amp; verified reviews</p>
        </div>
      </aside>

    </div>
  </main>

</body>
</html>
