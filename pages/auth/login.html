<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In — CineReview</title>
  <link rel="stylesheet" href="../../css/reset.css">
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <link rel="stylesheet" href="../../css/pages/auth.css">
</head>
<body class="auth-wrapper">

  <!-- Phase 1 Required Evaluator Bar: 3 Static Navbars Demonstration -->
  <aside class="navbar-eval-bar" aria-label="Phase 1 Navbar Review Strip">
    <div class="navbar-eval-title">
      <span>&#9881; Phase 1 Grading Strip: 3 Static Navbars</span>
    </div>
    <div class="navbar-eval-links">
      <span style="color:#aaa;">Preview State:</span>
      <a href="../../index.html" class="navbar-eval-btn">&#9679; 1. Guest View (Home)</a>
      <a href="../user/movies-list.html" class="navbar-eval-btn">&#9675; 2. User View (Catalog)</a>
      <a href="../admin/manage-reviews.html" class="navbar-eval-btn">&#9675; 3. Admin View (Dashboard)</a>
      <a href="../../cover-page.html" class="navbar-eval-btn navbar-eval-btn--cover">&#128196; Cover Page</a>
    </div>
  </aside>

  <!-- Shared Primary Header (Guest State) -->
  <header class="navbar">
    <a href="../../index.html" class="logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="4" width="20" height="16" rx="2"/>
        <path d="M7 8v8"/>
        <path d="M17 8v8"/>
        <path d="M2 12h20"/>
      </svg>
      <span>CineReview</span>
    </a>

    <form action="../user/search-movies.html" method="get" class="search-bar">
      <input type="text" name="title" placeholder="Search Reviews, Movies, Directors.." autocomplete="off">
      <button type="submit" class="search-btn" title="Search" aria-label="Search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>
    </form>

    <nav class="nav-links">
      <a href="../../index.html">Home</a>
      <a href="../user/movies-list.html">Top Rated</a>
      <a href="../user/movies-list.html">Browse Movies</a>
      <a href="../user/search-movies.html">Search</a>
    </nav>

    <div class="user-nav-actions">
      <a href="login.html" class="nav-logout-btn" style="border-color: var(--accent-secondary, #e54747); color: #fff;">Log In</a>
      <a href="signup.html" class="auth-btn-primary" style="padding: 0.4rem 0.9rem; font-size: 0.85rem; height: auto; margin-top: 0;">Sign Up</a>
    </div>
  </header>

  <!-- Split Screen Authentication Card -->
  <main class="auth-container">
    <div class="auth-card">

      <!-- Form Section -->
      <section class="auth-panel" aria-labelledby="login-heading">
        <div class="auth-header">
          <h1 id="login-heading">Welcome Back</h1>
          <p>Don't have an account yet? <a href="signup.html">Sign up here</a></p>
        </div>

        <form class="auth-form" action="../../index.html" method="post">

          <!-- Identifier (Username or Email) -->
          <div class="auth-field">
            <label for="identifier">Username or Email</label>
            <input type="text" id="identifier" name="identifier" placeholder="Enter username or email" autocomplete="username" required>
          </div>

          <!-- Password -->
          <div class="auth-field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
          </div>

          <!-- Remember Me -->
          <label class="auth-checkbox-group">
            <input type="checkbox" name="remember" checked>
            <span>Remember me on this device</span>
          </label>

          <!-- Submit Button -->
          <button type="submit" class="auth-btn-primary">Log In</button>
        </form>
      </section>

      <!-- Minimalist Cinema Hero (Clean image backdrop, no AI slogans) -->
      <aside class="auth-hero" aria-hidden="true">
        <img class="auth-hero-img" src="../../Gemini_Generated_Image_mzmgvhmzmgvhmzmg.jfif" alt="Cinema theater backdrop">
        <div class="auth-hero-overlay"></div>
        <div class="auth-hero-watermark">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="2"/>
            <path d="M7 8v8"/>
            <path d="M17 8v8"/>
            <path d="M2 12h20"/>
          </svg>
          <span>CineReview</span>
        </div>
      </aside>

    </div>
  </main>

</body>
</html>
