<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../css/pages/login.css">
  <title>Log In</title>
</head>
<body>
  <main class="card">
    <section class="panel">
        <h1>Log In</h1>
        <p class="sub">Don't have an account? <a href="signup.html">Sign Up</a></p>
  
        <form action="../../index.html" method="post">
          <div class="field">
            <label for="email">Email Address or Username</label>
            <input id="email" name="email" type="text" placeholder="Email or Username" autocomplete="username" required>
          </div>
  
          <div class="field">
            <label for="password">Password</label>
            <div class="password">
              <input id="password" name="password" type="password" placeholder="Password" autocomplete="current-password" required>
            </div>
          </div>
  
          <button type="submit" class="primary">Log In</button>
        </form>
    </section>

    <aside class="hero" aria-hidden="true">
        <img src="../../Gemini_Generated_Image_mzmgvhmzmgvhmzmg.jfif" alt="Hero picture">
    </aside>
  </main>
</body>
</html>
